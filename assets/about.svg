  <rect x="226" y="482" width="102" height="40" rx="20" fill="#000000"/><text x="277.0" y="508.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">Kotlin</text>
  <rect x="338" y="482" width="155" height="40" rx="20" fill="#000000"/><text x="415.5" y="508.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">Spring Boot</text>
  <rect x="137.25" y="533.25" width="109.5" height="37.5" rx="18.75" fill="none" stroke="#000000" stroke-width="2.5"/><text x="192.0" y="558.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#000000">Node.js</text>
  <rect x="259.25" y="533.25" width="109.5" height="37.5" rx="18.75" fill="none" stroke="#000000" stroke-width="2.5"/><text x="314.0" y="558.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#000000">Express</text>
  <rect x="381.25" y="533.25" width="99.5" height="37.5" rx="18.75" fill="none" stroke="#000000" stroke-width="2.5"/><text x="431.0" y="558.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#000000">NestJS</text>
  <rect x="493.25" y="533.25" width="109.5" height="37.5" rx="18.75" fill="none" stroke="#000000" stroke-width="2.5"/><text x="548.0" y="558.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#000000">FastAPI</text>
  <text x="136" y="612" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="15" fill="#555">검은 배지는 주력, 테두리 배지는 함께 익히는 중인 기술</text>

  <text x="640" y="452" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#000000">Database</text>
  <rect x="640" y="482" width="91" height="40" rx="20" fill="#000000"/><text x="685.5" y="508.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">MySQL</text>
  <rect x="741" y="482" width="144" height="40" rx="20" fill="#000000"/><text x="813.0" y="508.5" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">PostgreSQL</text>

  <text transform="translate(1146 420) rotate(90)" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="2" fill="#12D88F">PORTFOLIO</text>
