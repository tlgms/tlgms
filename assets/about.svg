  <text x="222" y="332" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="18" fill="#000000">siheun9@gmail.com</text>
  <text x="136" y="363" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" fill="#000000">Blog</text>
  <text x="222" y="363" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="18" fill="#000000">velog.io/@siheun9</text>

